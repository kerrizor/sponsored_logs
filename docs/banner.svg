<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 240" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b0f19" />
      <stop offset="100%" stop-color="#161e2e" />
    </linearGradient>

    <!-- Ad Gold Gradient -->
    <linearGradient id="gold" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#f59e0b" />
      <stop offset="100%" stop-color="#fbbf24" />
    </linearGradient>

    <!-- Terminal Frame Gradient -->
    <linearGradient id="frame" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1f2937" />
      <stop offset="100%" stop-color="#111827" />
    </linearGradient>

    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <style>
    .font-mono { font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, "Liberation Mono", monospace; }
    .font-sans { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; }
  </style>

  <!-- Card Canvas -->
  <rect width="800" height="240" rx="16" fill="url(#bg)" stroke="#374151" stroke-width="1.5"/>

  <!-- ================= LOGO ICON ================= -->
  <g transform="translate(36, 32)">
    <!-- Terminal Window -->
    <rect width="176" height="176" rx="14" fill="url(#frame)" stroke="#374151" stroke-width="1.5"/>
    
    <!-- Window Bar -->
    <path d="M 0 14 A 14 14 0 0 1 14 0 L 162 0 A 14 14 0 0 1 176 14 L 176 30 L 0 30 Z" fill="#1f2937"/>
    <circle cx="16" cy="15" r="4" fill="#ef4444" />
    <circle cx="28" cy="15" r="4" fill="#f59e0b" />
    <circle cx="40" cy="15" r="4" fill="#10b981" />

    <!-- Regular Log Lines (Faded) -->
    <rect x="16" y="44" width="42" height="6" rx="3" fill="#60a5fa" opacity="0.6"/>
    <rect x="64" y="44" width="70" height="6" rx="3" fill="#4b5563"/>
    <rect x="140" y="44" width="20" height="6" rx="3" fill="#374151"/>

    <rect x="16" y="58" width="56" height="6" rx="3" fill="#ef4444" opacity="0.8"/>
    <rect x="78" y="58" width="82" height="6" rx="3" fill="#4b5563"/>

    <!-- High-CPM Sponsored Banner Log Line -->
    <g transform="translate(12, 74)">
      <rect width="152" height="46" rx="6" fill="#181308" stroke="#d97706" stroke-width="1.5"/>
      <rect x="8" y="9" width="34" height="14" rx="3" fill="url(#gold)"/>
      <text x="25" y="19.5" fill="#000" font-size="8" font-weight="900" text-anchor="middle" class="font-mono">AD</text>
      
      <!-- Dollar Sign Dynamic Chart Element -->
      <text x="136" y="24" fill="#fbbf24" font-size="16" font-weight="bold" class="font-mono" filter="url(#glow)">$</text>

      <!-- Sponsored Log Payload -->
      <rect x="48" y="13" width="72" height="6" rx="3" fill="#fbbf24" opacity="0.9"/>
      <rect x="8" y="29" width="112" height="5" rx="2.5" fill="#d97706" opacity="0.6"/>
    </g>

    <!-- Subsequent Log Telemetry Lines -->
    <rect x="16" y="130" width="36" height="6" rx="3" fill="#60a5fa" opacity="0.6"/>
    <rect x="58" y="130" width="86" height="6" rx="3" fill="#4b5563"/>

    <rect x="16" y="144" width="48" height="6" rx="3" fill="#34d399" opacity="0.6"/>
    <rect x="70" y="144" width="50" height="6" rx="3" fill="#4b5563"/>
    <rect x="126" y="144" width="34" height="6" rx="3" fill="#374151"/>

    <!-- Cursor -->
    <rect x="16" y="158" width="8" height="8" rx="1" fill="#38bdf8" opacity="0.9"/>
  </g>

  <!-- ================= WORDMARK ================= -->
  <g transform="translate(244, 98)">
    <text class="font-sans" font-weight="900" font-size="52" fill="#ffffff" letter-spacing="-0.04em">
      Sponsored<tspan fill="#fbbf24">Logs</tspan>
    </text>

    <!-- TM Badge -->
    <text x="396" y="-22" class="font-mono" font-size="13" font-weight="700" fill="#9ca3af">™</text>

    <!-- Subtitle / Positioning Statement -->
    <text y="38" class="font-mono" font-size="14" font-weight="600" fill="#38bdf8" letter-spacing="0.05em">
      LOG-NATIVE ADVERTISING PLATFORM
    </text>

    <!-- Satirical Tagline -->
    <text y="64" class="font-sans" font-size="13.5" font-weight="400" fill="#9ca3af">
      Monetizing your stdout at the moment of peak incident attention.
    </text>
  </g>

  <!-- Micro "Promoted" Tag in Top Right Corner -->
  <g transform="translate(680, 24)">
    <rect width="84" height="22" rx="4" fill="#1e293b" stroke="#334155" stroke-width="1"/>
    <text x="42" y="15" class="font-mono" font-size="10" font-weight="700" fill="#f59e0b" text-anchor="middle" letter-spacing="0.08em">SPONSORED</text>
  </g>
</svg>
